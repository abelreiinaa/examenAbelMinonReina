<!DOCTYPE html>
<html>
<head>
    <title>Calculadora Simple</title>
    <style>
        .container {
            text-align: center;
            margin-top: 50px;
        }
        .content {
            display: inline-block;
            text-align: left;
        }
        .input-container {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        .input-container label {
            width: 150px;
            margin-right: 10px;
        }
        .input-container input[type="text"] {
            width: 150px;
        }
        
        /* Estilos generales para los botones */
        input[type="button"] {
            margin-right: 5px;
            padding: 8px 15px; /* Un poco de espacio interno */
            border: none;      /* Quitar el borde por defecto */
            cursor: pointer;   /* Cambiar el cursor a manita */
            font-weight: bold;
            color: white;      /* Texto blanco */
        }

        /* Estilo específico para Suma (Verde) */
        .btn-suma {
            background-color: green;
        }
        
        /* Estilo específico para Resta (Rojo) */
        .btn-resta {
            background-color: red;
        }

        /* Efecto al pasar el mouse por encima (opcional, para que se vea mejor) */
        .btn-suma:hover { background-color: darkgreen; }
        .btn-resta:hover { background-color: darkred; }

    </style>
</head>
<body>

<div class="container">
    <div class="content">
        <h2>Operaciones con dos números</h2>

        <form>
            <div class="input-container">
                <label for="num1">Primer número:</label>
                <input type="text" id="num1">
            </div>
            <div class="input-container">
                <label for="num2">Segundo número:</label>
                <input type="text" id="num2">
            </div>
            
            <input type="button" value="Calcular suma" onclick="calcularSuma()" class="btn-suma">
            
            <input type="button" value="Calcular resta" onclick="calcularResta()" class="btn-resta">
        </form>

        <div id="resultado" style="margin-top: 20px; font-weight: bold;"></div>
    </div>
</div>

<script>
function calcularSuma() {
    var num1 = parseFloat(document.getElementById("num1").value);
    var num2 = parseFloat(document.getElementById("num2").value);

    if (!isNaN(num1) && !isNaN(num2)) {
        var suma = num1 + num2;
        document.getElementById("resultado").innerHTML = "El resultado de la suma es: " + suma;
        // Opcional: cambiar el color del texto del resultado a verde
        document.getElementById("resultado").style.color = "green"; 
    } else {
        mostrarError();
    }
}

function calcularResta() {
    var num1 = parseFloat(document.getElementById("num1").value);
    var num2 = parseFloat(document.getElementById("num2").value);

    if (!isNaN(num1) && !isNaN(num2)) {
        var resta = num1 - num2;
        document.getElementById("resultado").innerHTML = "El resultado de la resta es: " + resta;
        // Opcional: cambiar el color del texto del resultado a rojo
        document.getElementById("resultado").style.color = "red";
    } else {
        mostrarError();
    }
}

function mostrarError() {
    document.getElementById("resultado").innerHTML = "Por favor, ingrese dos números válidos.";
    document.getElementById("resultado").style.color = "black";
}
</script>

</body>
</html>
