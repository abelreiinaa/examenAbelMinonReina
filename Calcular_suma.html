<!DOCTYPE html>
<html>
<head>
    <title>Calculadora Simple</title>
    <style>
        .container {
            text-align: center;
            margin-top: 50px;
        }
        .content {
            display: inline-block;
            text-align: left;
        }
        .input-container {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        .input-container label {
            width: 150px;
            margin-right: 10px;
        }
        .input-container input[type="text"] {
            width: 150px;
        }
        
        /* Estilos generales */
        input[type="button"] {
            margin-right: 5px;
            padding: 8px 15px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            color: white;
        }


        /* Colores de los botones */
        .btn-suma { background-color: green; }
        .btn-resta { background-color: red; }
        .btn-multi { background-color: blue; } /* Nuevo estilo para Multiplicación */

        /* Efectos hover */
        .btn-suma:hover { background-color: darkgreen; }
        .btn-resta:hover { background-color: darkred; }
        .btn-multi:hover { background-color: darkblue; }

        /* Colores */
        .btn-suma { background-color: green; }
        .btn-resta { background-color: red; }
        .btn-div { background-color: orange; } /* Color para el cociente */

        /* Hover */
        .btn-suma:hover { background-color: darkgreen; }
        .btn-resta:hover { background-color: darkred; }
        .btn-div:hover { background-color: darkorange; }


    </style>
</head>
<body>

<div class="container">
    <div class="content">
        <h2>Operaciones con dos números</h2>

        <form>
            <div class="input-container">
                <label for="num1">Primer número:</label>
                <input type="text" id="num1">
            </div>
            <div class="input-container">
                <label for="num2">Segundo número:</label>
                <input type="text" id="num2">
            </div>
            
            <input type="button" value="Sumar" onclick="calcularSuma()" class="btn-suma">
            <input type="button" value="Restar" onclick="calcularResta()" class="btn-resta">
            <input type="button" value="Multiplicar" onclick="calcularMultiplicacion()" class="btn-multi">
            <input type="button" value="Calcular suma" onclick="calcularSuma()" class="btn-suma">
            <input type="button" value="Calcular resta" onclick="calcularResta()" class="btn-resta">
            
            <input type="button" value="Calcular cociente" onclick="calcularCociente()" class="btn-div">
        </form>

        <div id="resultado" style="margin-top: 20px; font-weight: bold;"></div>
    </div>
</div>

<script>
// Función Suma
function calcularSuma() {
    var num1 = parseFloat(document.getElementById("num1").value);
    var num2 = parseFloat(document.getElementById("num2").value);

    if (!isNaN(num1) && !isNaN(num2)) {
        var suma = num1 + num2;
        document.getElementById("resultado").innerHTML = "El resultado de la suma es: " + suma;
        document.getElementById("resultado").style.color = "green"; 
    } else {
        mostrarError();
    }
}

// Función Resta
function calcularResta() {
    var num1 = parseFloat(document.getElementById("num1").value);
    var num2 = parseFloat(document.getElementById("num2").value);

    if (!isNaN(num1) && !isNaN(num2)) {
        var resta = num1 - num2;
        document.getElementById("resultado").innerHTML = "El resultado de la resta es: " + resta;
        document.getElementById("resultado").style.color = "red";
    } else {
        mostrarError();
    }
}

// NUEVA FUNCIÓN: COCIENTE
function calcularCociente() {
    var num1 = parseFloat(document.getElementById("num1").value);
    var num2 = parseFloat(document.getElementById("num2").value);

    if (!isNaN(num1) && !isNaN(num2)) {
        var multi = num1 * num2;
        document.getElementById("resultado").innerHTML = "El resultado de la multiplicación es: " + multi;
        document.getElementById("resultado").style.color = "blue"; // Texto azul
        if (num2 === 0) {
            // Evitar dividir por cero
            document.getElementById("resultado").innerHTML = "Error: No se puede dividir por cero";
            document.getElementById("resultado").style.color = "black";
        } else {
            var cociente = num1 / num2;
            // .toFixed(2) limita a 2 decimales para que se vea mejor
            document.getElementById("resultado").innerHTML = "El cociente es: " + cociente.toFixed(2);
            document.getElementById("resultado").style.color = "orange";
        }
    } else {
        mostrarError();
    }
}

function mostrarError() {
    document.getElementById("resultado").innerHTML = "Por favor, ingrese dos números válidos.";
    document.getElementById("resultado").style.color = "black";
}
</script>

</body>
</html>
